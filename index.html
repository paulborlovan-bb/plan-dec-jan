<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Protected document</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff;color:#000;font:17px/1.5 system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;padding:24px 16px}
  form{width:min(100%,380px);display:grid;gap:14px}
  h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.02em;line-height:1.15;text-transform:uppercase}
  p{margin:0;color:#444442}
  input,button{font:inherit;padding:13px 16px;border-radius:0;border:1px solid #000;background:#fff;color:#000;width:100%}
  input:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:2px}
  button{background:#000;color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:progress}
  #m{min-height:1.5em;font-size:15px}
  #m.bad{color:#b3261e}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Protected document</h1>
  <p>Enter the password you were given to open it.</p>
  <input id="p" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Password" required>
  <button id="b">Open</button>
  <p id="m" role="status"></p>
</form>
<script>
const SALT = 'jzfkjvS+lldXFd3xo98+eA==', ITER = 600000;
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const f = document.getElementById('f'), p = document.getElementById('p'), b = document.getElementById('b'), m = document.getElementById('m');
const sealed = fetch('page.bin').then((r) => { if (!r.ok) throw new Error('load'); return r.arrayBuffer(); });
sealed.catch(() => {});
async function unlock(raw) {                            // only the right key gets through
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']), buf = new Uint8Array(await sealed);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12)));
}
function show(html, raw64) {                            // the page's PDF button needs the key too
  window.__DS_RAW = raw64;
  document.open(); document.write(html.replace('<head>', '<head><script>window.__DS_RAW=' + JSON.stringify(raw64) + '<\/script>')); document.close();
}
f.addEventListener('submit', async (e) => {
  e.preventDefault(); b.disabled = true; m.className = ''; m.textContent = 'Opening…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p.value.trim()), 'PBKDF2', false, ['deriveBits']);
    const raw = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
    const html = await unlock(raw), raw64 = btoa(String.fromCharCode(...raw));
    try { sessionStorage.setItem('ds_k', raw64); } catch (_) {}
    show(html, raw64);
  } catch (err) {
    b.disabled = false; m.className = 'bad';
    m.textContent = err && err.message === 'load' ? 'The document could not be loaded. Check your connection and try again.' : 'That password did not open the document.';
    p.select();
  }
});
// same tab, already opened once: no need to ask again
try { const k = sessionStorage.getItem('ds_k'); if (k) unlock(bytes(k)).then((html) => show(html, k)).catch(() => sessionStorage.removeItem('ds_k')); } catch (_) {}
p.focus();
</script>
</body>
</html>
